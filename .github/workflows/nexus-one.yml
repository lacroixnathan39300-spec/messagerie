name: "NEXUS ONE : APK de test"
on:
  push:
    branches: [launcher-nexus-one]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-one-apk
          path: nexus-one/app/build/outputs/apk/debug/app-debug.apk
      - name: Publication de l'APK (lien direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NexusOne.apk
          TAG="nexus-one-${{ github.run_number }}"
          gh release create "$TAG" NexusOne.apk --title "NEXUS ONE test ${{ github.run_number }}" --notes "Version de test du launcher." --prerelease --target "${{ github.sha }}" || gh release upload "$TAG" NexusOne.apk --clobber
