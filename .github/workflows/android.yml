name: "Messagerie : APK de test"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilation APK debug (non signée pour la clé de production)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: messagerie-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publication de l'APK en release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Messagerie-test-${{ github.run_number }}.apk"
          gh release create "$TAG" "Messagerie-test-${{ github.run_number }}.apk" --title "Messagerie test ${{ github.run_number }}" --notes "APK de test (non signée pour la production)." --prerelease || gh release upload "$TAG" "Messagerie-test-${{ github.run_number }}.apk" --clobber
