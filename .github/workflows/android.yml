name: "Messagerie : APK de test"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilation APK release (signée avec la clé stable du dépôt)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: messagerie-debug
          path: app/build/outputs/apk/release/*.apk
      - name: Publication de l'APK en release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk Messagerie.apk
          gh release create "$TAG" Messagerie.apk --title "Messagerie test ${{ github.run_number }}" --notes "APK signée (clé stable)." --latest || gh release upload "$TAG" Messagerie.apk --clobber
