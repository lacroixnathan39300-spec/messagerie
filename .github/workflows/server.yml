name: "Relais messagerie"

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 213b44e8b46a4306e1586f24124d0221
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Vérification des types
        run: npx tsc -p .
      - name: Mise en ligne (Cloudflare)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : relais non mis en ligne."; exit 0
          fi
          # Espaces de stockage : créés s'ils n'existent pas, puis reliés au fichier de configuration.
          liste=$(npx wrangler kv namespace list)
          for nom in messagerie-annuaire messagerie-boites; do
            id=$(echo "$liste" | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('$nom')),''))")
            if [ -z "$id" ]; then
              npx wrangler kv namespace create "$nom" >/dev/null
              liste=$(npx wrangler kv namespace list)
              id=$(echo "$liste" | python3 -c "import json,sys; print(next(n['id'] for n in json.load(sys.stdin) if n['title'].endswith('$nom')))")
            fi
            if [ "$nom" = "messagerie-annuaire" ]; then sed -i "s/REMPLACE_ANNUAIRE_PAR_LA_CI/$id/" wrangler.toml; else sed -i "s/REMPLACE_BOITES_PAR_LA_CI/$id/" wrangler.toml; fi
          done
          npx wrangler deploy
          echo "### Relais en ligne : https://messagerie.roadguard-app.workers.dev" >> "$GITHUB_STEP_SUMMARY"
