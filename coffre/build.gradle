plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'fr.messagerie.coffre'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.messagerie.coffre'
        minSdk 26
        targetSdk 35
        versionCode (project.hasProperty('vc') ? project.property('vc').toString().toInteger() : 1)
        versionName '1.0'
    }
    signingConfigs {
        // Signature de release : lue depuis l'environnement (secrets GitHub), jamais depuis le dépôt.
        // Sans ces variables, la version release reste non signée.
        release {
            if (System.getenv("RELEASE_KEYSTORE")) {
                storeFile file(System.getenv("RELEASE_KEYSTORE"))
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
