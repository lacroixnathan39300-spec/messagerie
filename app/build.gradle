plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'fr.messagerie.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.messagerie.app'
        minSdk 26
        targetSdk 35
        versionCode (project.hasProperty('vc') ? project.property('vc').toString().toInteger() : 1)
        versionName '1.0'
    }
    signingConfigs {
        // Clé stable : les nouvelles versions s'installent par-dessus l'ancienne sans effacer les données.
        // La clé est dans le dépôt (pas un secret) : elle sert à la continuité, pas à prouver l'auteur.
        release {
            storeFile file('clef.jks')
            storePassword 'messagerie2026'
            keyAlias 'messagerie'
            keyPassword 'messagerie2026'
        }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
